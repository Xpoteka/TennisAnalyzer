# Tennis Analyzer configuration. Every key is optional; the values below are the defaults.
# Copy to config.yaml and change what you need. Unknown keys are an error.
# Changing a stage's keys reruns that stage (and only that stage) on the next analysis.

paths:
  # Database, uploaded videos, results and downloaded models. Relative to this file.
  data_root: ./data
  # Hand-made label files used by the evaluation tools.
  labels_dir: ./labels

proxy:
  # The browser-playable copy of each video: its height in pixels, and its quality
  # (lower CRF = better and bigger). Sources browsers can already play are linked instead.
  height: 720
  crf: 26
  # auto: Apple's hardware encoder on macOS, libx264 elsewhere.
  encoder: auto

audio:
  # Ball-impact detection in the soundtrack.
  highpass_hz: 800.0
  highpass_order: 4
  onset_k: 6.0                # threshold = median + k * MAD of the onset envelope
  min_separation_s: 0.25
  threshold_window_s: 5.0
  amplitude_window_s: 0.02
  min_prominence_db: 6.0      # drop onsets this close to the background level

pose:
  backend: yolo
  model: yolo11m-pose.pt      # downloaded into <data_root>/models on first use
  device: auto                # auto | cuda | mps | cpu
  batch_size: 16
  imgsz: 960
  min_person_conf: 0.2
  kp_conf_min: 0.3
  sample_fps: 10.0            # frames per second analysed to track people

court:
  frames: 24                  # frames sampled across each video to find the court
  min_quality: 0.5            # below this the court counts as not found: no ball stats
  # Court corners by hand, as fractions of the frame, when detection fails:
  # [[x, y] far-left, far-right, near-right, near-left] of the doubles court.
  manual_corners: null

ball:
  detector: motion            # motion | motion+yolo
  yolo_model: yolo11m.pt
  min_area_px: 2.0
  max_area_frac: 0.0015       # of the frame area
  max_gap_frames: 4
