<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Tennis Technique Analyzer</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎾</text></svg>">
</head>
<body class="login-page">
<form class="panel login" id="login">
  <div class="brand"><span class="ball">🎾</span> Tennis Technique Analyzer</div>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
  <button class="primary" type="submit">Log in</button>
  <p class="status bad" id="error" role="alert"></p>
</form>
<script>
'use strict';
document.getElementById('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const error = document.getElementById('error');
  const button = e.target.querySelector('button');
  error.textContent = '';
  button.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (res.ok) { location.href = '/'; return; }
    const body = await res.json().catch(() => ({}));
    error.textContent = body.error || `could not log in (${res.status})`;
  } catch {
    error.textContent = 'the server did not answer';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
