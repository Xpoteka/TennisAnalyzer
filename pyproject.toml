[project]
name = "tennis-analyzer"
version = "2.0.0.dev0"
description = "Tennis session analysis: shots, ball stats, match scoring and player profiles from video."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "librosa>=0.11.0",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.154",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    # Pulled in by ultralytics anyway; listed so Linux can take them from the CPU index below.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
tennis = "tennis.cli:main"

[project.optional-dependencies]
cpu = ["torch>=2.14.0", "torchvision>=0.29.0"]
# triton-xpu is only on PyTorch's own index, so it is named here to be looked up there.
xpu = ["torch>=2.14.0", "torchvision>=0.29.0", "triton-xpu>=3.8.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

# Which PyTorch gets installed decides what the analysis runs on:
#   uv sync               PyPI's build: NVIDIA GPUs (CUDA) on Linux, the Apple GPU on a Mac
#   uv sync --extra cpu   CPU only. The Docker image and CI use it: the CUDA build is several
#                         GB of NVIDIA libraries that a server without such a card cannot use
#   uv sync --extra xpu   Intel GPUs (Arc, and the graphics built into Core Ultra)
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "xpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis"]
# The React build is generated (web/ → tennis/api/static) and git-ignored, but ships in the wheel.
artifacts = ["tennis/api/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["tennis"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyarrow", "pyarrow.*", "scipy", "scipy.*", "librosa", "librosa.*",
    "ultralytics", "ultralytics.*", "torch", "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
    "real_yolo: loads the real YOLO pose model (downloads it on first use)",
]
