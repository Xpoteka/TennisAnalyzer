[project]
name = "tennis-analyzer"
version = "0.1.0"
description = "Local pipeline that measures tennis technique from fixed-camera session videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "librosa>=0.11.0",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.154",
]

[project.scripts]
tennis = "tennis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tennis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["tennis"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyarrow", "pyarrow.*", "scipy", "scipy.*", "librosa", "librosa.*",
    "ultralytics", "ultralytics.*", "torch", "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
    "real_yolo: loads the real YOLO pose model (downloads it on first use)",
]
